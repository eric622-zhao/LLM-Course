<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AnythingLLM 上传与问答</title>
<style>
  :root {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --ink: #1b2233;
    --ink-soft: #5c6784;
    --line: #e3e8f2;
    --brand: #3d6bff;
    --brand-dark: #2b52d6;
    --ok: #12a15a;
    --err: #d92b2b;
    --radius: 16px;
    --shadow: 0 18px 50px rgba(28, 42, 84, .12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 480px at 12% -8%, #dfe8ff 0%, transparent 60%),
      radial-gradient(760px 420px at 100% 4%, #e6f7f1 0%, transparent 55%),
      var(--bg);
  }

  .shell { width: 100%; max-width: 760px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 30px 30px 26px;
  }

  header { margin-bottom: 22px; }

  h1 {
    margin: 0 0 8px;
    font-size: 21px;
    letter-spacing: .2px;
  }

  .sub {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--ink-soft);
  }

  .target {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 20px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: #f8faff;
    font-size: 13px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #c3cbdb;
    flex: none;
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(18,161,90,.14); }
  .dot.off { background: var(--err); box-shadow: 0 0 0 4px rgba(217,43,43,.13); }

  .target .label { color: var(--ink-soft); }
  .target strong { font-weight: 600; }
  .target .spacer { flex: 1; }

  textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    background: #fff;
    resize: vertical;
    display: none;
  }

  .drop {
    border: 1.8px dashed #c6d2ea;
    border-radius: 13px;
    padding: 34px 20px;
    text-align: center;
    cursor: pointer;
    transition: .18s ease;
    background: #fbfcff;
  }

  .drop:hover, .drop.hot {
    border-color: var(--brand);
    background: #f2f6ff;
  }

  .drop .icon {
    width: 44px; height: 44px;
    margin: 0 auto 12px;
    border-radius: 12px;
    background: linear-gradient(140deg, #e8efff, #dbe7ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 21px;
  }

  .drop .t1 { font-size: 14.5px; font-weight: 600; }
  .drop .t2 { margin-top: 6px; font-size: 12.5px; color: var(--ink-soft); }

  .file {
    display: none;
    align-items: center;
    gap: 11px;
    margin-top: 16px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: #f8faff;
  }

  .file.show { display: flex; }

  .file .name {
    flex: 1;
    font-size: 13.5px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file .size { font-size: 12px; color: var(--ink-soft); flex: none; }

  .file button {
    flex: none;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 4px;
  }
  .file button:hover { color: var(--err); }

  .actions { margin-top: 20px; }

  .btn {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 13px 18px;
    font: inherit;
    font-size: 14.5px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(180deg, var(--brand), var(--brand-dark));
    cursor: pointer;
    transition: .18s ease;
  }

  .btn:hover:not(:disabled) { filter: brightness(1.06); }
  .btn:disabled {
    background: #ccd5e6;
    cursor: not-allowed;
  }

  .bar {
    height: 6px;
    border-radius: 99px;
    background: #e8ecf6;
    overflow: hidden;
    margin-top: 14px;
    display: none;
  }
  .bar.show { display: block; }
  .bar span {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--brand), #58c8a8);
    transition: width .25s ease;
  }

  .msg {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 11px;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .msg.show { display: block; }
  .msg.ok { background: #eafaf1; border: 1px solid #bfe9d2; color: #0d7a45; }
  .msg.err { background: #fdeeee; border: 1px solid #f6cccc; color: #b01f1f; }
  .msg.info { background: #eef3ff; border: 1px solid #d3dffa; color: #2b4a9b; }

  /* ---------- 对话区 ---------- */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 26px 0 16px;
    font-size: 12px;
    color: #8b95ab;
  }
  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .chat-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .chat-head strong { font-size: 14px; }
  .chat-head .spacer { flex: 1; }

  .switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
  }
  .switch input { accent-color: var(--brand); cursor: pointer; }

  .thread {
    max-height: 340px;
    overflow-y: auto;
    padding: 4px 2px 2px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .thread:empty::after {
    content: "上传完文件后，在这里提问试试。";
    display: block;
    padding: 22px 0;
    text-align: center;
    font-size: 12.5px;
    color: #a6afc2;
  }

  .turn {
    display: flex;
    flex-direction: column;
    gap: 5px;
    animation: fade .18s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }

  .turn.me { align-items: flex-end; }

  .bubble {
    max-width: 86%;
    padding: 10px 13px;
    border-radius: 13px;
    font-size: 13.5px;
    line-height: 1.68;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .turn.me .bubble {
    background: var(--brand);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .turn.ai .bubble {
    background: #f4f7ff;
    border: 1px solid #e1e8f8;
    border-bottom-left-radius: 4px;
  }
  .turn.ai .bubble.err {
    background: #fdeeee;
    border-color: #f6cccc;
    color: #b01f1f;
  }

  .caret {
    display: inline-block;
    width: 6px;
    height: 14px;
    margin-left: 2px;
    vertical-align: -2px;
    background: var(--brand);
    animation: blink .9s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .sources {
    max-width: 86%;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .src {
    padding: 7px 10px;
    border: 1px dashed #d7dff0;
    border-radius: 9px;
    background: #fbfcff;
    line-height: 1.55;
  }
  .src b { color: #3d4a68; font-weight: 600; }
  .src .score { color: #8b95ab; margin-left: 6px; }

  .ask {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    margin-top: 14px;
  }
  .ask textarea {
    flex: 1;
    resize: none;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 11px;
    font: inherit;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink);
    background: #fbfcff;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .ask textarea:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(61, 107, 255, .12);
    background: #fff;
  }
  .ask .btn { flex: none; }

  .hint {
    margin-top: 8px;
    font-size: 11.5px;
    color: #9aa4ba;
  }

  footer {
    margin-top: 18px;
    text-align: center;
    font-size: 11.5px;
    color: #8b95ab;
  }
</style>
</head>
<body>
<div class="shell">
  <div class="card">
    <header>
      <h1>📤 AnythingLLM 上传与问答</h1>
      <p class="sub">把本地文件传进 AnythingLLM 工作区（自动解析并向量化），随后就能在该工作区里就这份资料提问。</p>
    </header>

    <div class="target">
      <span class="dot" id="dot"></span>
      <span class="label">目标工作区</span>
      <select id="wsSel" style="flex:1;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--ink);outline:none;cursor:pointer"></select>
      <span class="spacer"></span>
      <button id="refreshWs" style="border:0;background:none;color:var(--brand);font:inherit;font-size:12.5px;cursor:pointer">刷新</button>
    </div>

    <div class="drop" id="drop">
      <div class="icon">📄</div>
      <div class="t1">点击选择文件，或把文件拖到这里</div>
      <div class="t2">支持 txt / md / pdf / docx / csv / json 等 AnythingLLM 可解析格式</div>
      <input type="file" id="input" hidden />
    </div>

    <div class="file" id="file">
      <span class="name" id="fname"></span>
      <span class="size" id="fsize"></span>
      <button id="clear" title="移除">✕</button>
    </div>

    <div class="bar" id="bar"><span id="barIn"></span></div>

    <div class="actions">
      <button class="btn" id="upload" disabled>开始上传</button>
    </div>

    <div class="msg" id="msg"></div>

    <div class="divider">对话</div>

    <div class="chat-head">
      <strong>💬 就这份资料提问</strong>
      <span class="spacer"></span>
      <label class="switch" title="query 只依据文档回答并给出引用；chat 允许模型自由发挥">
        <input type="checkbox" id="freeMode" />
        允许自由发挥
      </label>
    </div>

    <div class="thread" id="thread"></div>

    <div class="ask">
      <textarea id="q" rows="2" placeholder="例如：这份资料的核心结论是什么？"></textarea>
      <button class="btn" id="send">发送</button>
    </div>
    <div class="hint" id="chatHint">Enter 发送 · Shift + Enter 换行 · 多轮会自动沿用同一会话</div>

    <footer>AnythingLLM 上传与问答页 · 第三次开发任务</footer>
  </div>
</div>

<script>
const drop   = document.getElementById('drop');
const input  = document.getElementById('input');
const fileBox= document.getElementById('file');
const fname  = document.getElementById('fname');
const fsize  = document.getElementById('fsize');
const clearB = document.getElementById('clear');
const uploadB= document.getElementById('upload');
const bar    = document.getElementById('bar');
const barIn  = document.getElementById('barIn');
const msg    = document.getElementById('msg');
const dot    = document.getElementById('dot');
const wsSel  = document.getElementById('wsSel');
const refreshB = document.getElementById('refreshWs');
const thread = document.getElementById('thread');
const qInput = document.getElementById('q');
const sendB  = document.getElementById('send');
const freeM  = document.getElementById('freeMode');
const chatHint = document.getElementById('chatHint');

let picked = null;
let sessionId = '';        // 多轮上下文：由后端返回，前端原样带回

function human(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}

function say(type, text) {
  msg.className = 'msg show ' + type;
  msg.textContent = text;
}

function showProgress(p) {
  bar.classList.add('show');
  barIn.style.width = Math.max(0, Math.min(100, p)) + '%';
}

function setFile(f) {
  if (!f) return;
  picked = f;
  fname.textContent = f.name;
  fsize.textContent = human(f.size);
  fileBox.classList.add('show');
  uploadB.disabled = false;
  msg.className = 'msg';
}

function resetFile() {
  picked = null;
  input.value = '';
  fileBox.classList.remove('show');
  uploadB.disabled = true;
  bar.classList.remove('show');
  barIn.style.width = '0%';
}

drop.addEventListener('click', () => input.click());
input.addEventListener('change', () => setFile(input.files[0]));
clearB.addEventListener('click', resetFile);

['dragenter', 'dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave', 'drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) setFile(f);
});

async function loadWorkspaces() {
  try {
    const r = await fetch('/api/workspaces');
    const j = await r.json();
    const list = j.workspaces || [];
    if (!r.ok || !list.length) throw new Error(j.message || '没有读到任何工作区');

    const keep = wsSel.value;
    wsSel.innerHTML = '';
    list.forEach(w => {
      const opt = document.createElement('option');
      opt.value = w.slug;
      opt.textContent = w.name || w.slug;
      wsSel.appendChild(opt);
    });
    if (keep && list.some(w => w.slug === keep)) wsSel.value = keep;

    dot.className = 'dot on';
    say('ok', '已连接 AnythingLLM，共 ' + list.length + ' 个工作区。');
  } catch (e) {
    dot.className = 'dot off';
    wsSel.innerHTML = '<option value="">未连接</option>';
    say('err', '读取工作区失败：' + e.message + '\n请确认 AnythingLLM 已打开。');
  }
}

// 切换工作区意味着换了知识库，旧会话的上下文不再适用
wsSel.addEventListener('change', () => {
  sessionId = '';
  thread.innerHTML = '';
  chatHint.textContent = '已切换到「' + wsSel.value + '」，开始新的会话';
});

refreshB.addEventListener('click', loadWorkspaces);

uploadB.addEventListener('click', () => {
  if (!picked) return;
  const slug = (wsSel.value || '').trim();
  const form = new FormData();
  form.append('file', picked);
  if (slug) form.append('slug', slug);

  uploadB.disabled = true;
  uploadB.textContent = '上传中…';
  say('info', '正在上传并等待向量化，大文件请耐心等待…');
  showProgress(8);

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');

  xhr.upload.onprogress = e => {
    if (e.lengthComputable) showProgress(e.loaded / e.total * 88);
  };

  xhr.onload = () => {
    let j = {};
    try { j = JSON.parse(xhr.responseText); } catch (_) {}
    showProgress(100);
    if (xhr.status >= 200 && xhr.status < 300 && j.success) {
      say('ok', '✅ 上传成功：' + picked.name + '\n工作区：' + (j.workspace || slug) +
          (j.location ? '\n服务器路径：' + j.location : ''));
      resetFile();
    } else {
      say('err', '❌ 上传失败：' + (j.message || xhr.status + ' ' + xhr.statusText));
    }
    uploadB.disabled = false;
    uploadB.textContent = '开始上传';
    bar.classList.remove('show');
  };

  xhr.onerror = () => {
    say('err', '❌ 网络错误，上传未完成。');
    uploadB.disabled = false;
    uploadB.textContent = '开始上传';
    bar.classList.remove('show');
  };

  xhr.send(form);
});

// ------------------------------------------------------------------ //
// 对话：后端统一发 SSE（有 Key 转发上游流式，无 Key 包装成一次性），
// 前端只解析 delta / sources / session / error / done 五种事件。
// ------------------------------------------------------------------ //
function addTurn(who, text) {
  const wrap = document.createElement('div');
  wrap.className = 'turn ' + who;
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;
  wrap.appendChild(bub);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
  return { wrap, bub };
}

function addSources(wrap, sources) {
  if (!sources || !sources.length) return;
  const box = document.createElement('div');
  box.className = 'sources';
  sources.forEach(s => {
    const el = document.createElement('div');
    el.className = 'src';
    const b = document.createElement('b');
    b.textContent = s.title || '片段';
    el.appendChild(b);
    if (typeof s.score === 'number') {
      const sp = document.createElement('span');
      sp.className = 'score';
      sp.textContent = s.score.toFixed(3);
      el.appendChild(sp);
    }
    el.appendChild(document.createTextNode('\n' + (s.snippet || '')));
    box.appendChild(el);
  });
  wrap.appendChild(box);
  thread.scrollTop = thread.scrollHeight;
}

async function ask() {
  const text = qInput.value.trim();
  if (!text) return;
  if (!wsSel.value) {
    say('err', '还没有可用工作区，请先确认 AnythingLLM 已打开后点「刷新」。');
    return;
  }

  qInput.value = '';
  qInput.style.height = 'auto';
  addTurn('me', text);

  const { wrap, bub } = addTurn('ai', '');
  const caret = document.createElement('span');
  caret.className = 'caret';
  bub.appendChild(caret);

  sendB.disabled = true;
  sendB.textContent = '生成中…';

  let acc = '';
  let errMsg = '';

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        slug: wsSel.value,
        mode: freeM.checked ? 'chat' : 'query',
        sessionId,
        stream: true,
      }),
    });

    if (!resp.ok || !resp.body) {
      let j = {};
      try { j = await resp.json(); } catch (_) {}
      throw new Error(j.message || ('HTTP ' + resp.status));
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let cut;
      while ((cut = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, cut);
        buf = buf.slice(cut + 2);

        const line = block.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;

        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch (_) { continue; }

        if (ev.type === 'delta') {
          acc += ev.text || '';
          caret.remove();
          bub.textContent = acc;
          bub.appendChild(caret);
          thread.scrollTop = thread.scrollHeight;
        } else if (ev.type === 'session') {
          if (ev.sessionId) sessionId = ev.sessionId;
        } else if (ev.type === 'sources') {
          addSources(wrap, ev.sources);
        } else if (ev.type === 'error') {
          errMsg = ev.message || '未知错误';
        }
      }
    }
  } catch (e) {
    errMsg = e.message || String(e);
  } finally {
    caret.remove();
    if (errMsg) {
      bub.classList.add('err');
      bub.textContent = '⚠️ ' + errMsg;
    } else if (!acc) {
      bub.textContent = '（没有返回内容，可能是该工作区里还没有已向量化的文档）';
    } else {
      bub.textContent = acc;
    }
    sendB.disabled = false;
    sendB.textContent = '发送';
    thread.scrollTop = thread.scrollHeight;
  }
}

sendB.addEventListener('click', ask);

qInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    ask();
  }
});

// 输入框随内容长高，最多 5 行
qInput.addEventListener('input', () => {
  qInput.style.height = 'auto';
  qInput.style.height = Math.min(qInput.scrollHeight, 120) + 'px';
});

loadWorkspaces();
</script>
</body>
</html>
