; 复制这个文件为 config.ini，然后填上你自己的信息。
; config.ini 已在仓库根目录的 .gitignore 里，不会被提交到 Git。
;
; 使用前先执行：
;   copy config.example.ini config.ini

[llm]
; 接口地址。用官方 OpenAI 就保持默认；国内平台换成各自的兼容地址，例如
;   DeepSeek      https://api.deepseek.com/v1
;   Kimi/月之暗面  https://api.moonshot.cn/v1
;   通义千问       https://dashscope.aliyuncs.com/compatible-mode/v1
;   本地 Ollama    http://127.0.0.1:11434/v1
base_url = https://api.openai.com/v1

; 模型名称，必须和你使用的平台对上
; 注意：模型需要支持 Function Calling，否则工具调不起来
model = gpt-4o-mini

; 你的 API Key，注意不要提交到 Git
api_key = sk-替换成你自己的key

; 采样温度，0 稳定、1 发散
temperature = 0.7

[search]
; 百度千帆 AI 搜索的 API Key（searchWeb 工具用）
; 申请：https://console.bce.baidu.com/qianfan/ → API Key 管理
; 还需在千帆控制台开通「百度搜索」服务；每月有免费额度。
; 不填则 searchWeb 返回明确的"未配置"错误，其它功能不受影响。
baidu_qianfan_api_key = 替换成你的千帆key

[tools]
; 读取文件时最多返回多少字符
read_max_chars = 60000

; --- fetchWeb 网页获取 ---
; 单次请求超时（秒）
fetchweb_timeout = 20
; 正文最多返回多少字符，超出会截断并注明
fetchweb_max_chars = 12000

; --- searchWeb 联网搜索 ---
; 默认返回多少条结果（1~20）
search_top_k = 8
; 搜索接口超时（秒）
search_timeout = 25

; --- RunCli 本地命令 ---
; 默认执行超时（秒），单次调用可覆盖，上限 300
cli_timeout = 60
; stdout / stderr 各自最多回传多少字符
cli_max_output = 8000

; --- loadSkill 技能加载 ---
; SKILL.md 或附件最多返回多少字符
skill_max_chars = 20000

[agent]
; 单轮提问里最多允许几轮工具调用，防止模型绕圈死循环
max_tool_rounds = 12
