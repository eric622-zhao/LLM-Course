; 复制这个文件为 config.ini，然后填上你自己的信息。
; config.ini 已在仓库根目录的 .gitignore 里，不会被提交到 Git。
;
; 使用前先执行：
;   copy config.example.ini config.ini

[llm]
; 接口地址。用官方 OpenAI 就保持默认；国内平台换成各自的兼容地址，例如
;   DeepSeek      https://api.deepseek.com/v1
;   Kimi/月之暗面  https://api.moonshot.cn/v1
;   通义千问       https://dashscope.aliyuncs.com/compatible-mode/v1
;   火山方舟       https://ark.cn-beijing.volces.com/api/v3
;   硅基流动       https://api.siliconflow.cn/v1
;   本地 Ollama    http://127.0.0.1:11434/v1
base_url = https://api.openai.com/v1

; 模型名称，必须和你使用的平台对上
; 注意：模型需要支持 Function Calling，否则工具调不起来
;   火山方舟要先在控制台「开通管理」里开通模型，否则调用返回 404
;   （has not activated the model）。可用 GET /api/v3/models 查账号下的模型，
;   看 features.tools.function_calling 是否为 true。
model = gpt-4o-mini

; 你的 API Key，注意不要提交到 Git
api_key = sk-替换成你自己的key

; 采样温度，0 稳定、1 发散
temperature = 0.7

[search]
; 百度千帆 AI 搜索的 API Key（searchWeb 工具用）
; 申请：https://console.bce.baidu.com/qianfan/ → API Key 管理
; 还需在千帆控制台开通「百度搜索」服务；每月有免费额度。
; 不填则 searchWeb 返回明确的"未配置"错误，其它功能不受影响。
baidu_qianfan_api_key = 替换成你的千帆key

[tools]
; 读取文件时最多返回多少字符
read_max_chars = 60000

; --- fetchWeb 网页获取 ---
; 单次请求超时（秒）
fetchweb_timeout = 20
; 正文最多返回多少字符，超出会截断并注明
fetchweb_max_chars = 12000

; --- searchWeb 联网搜索 ---
; 默认返回多少条结果（1~20）。条数越多上下文越长，5 条通常够用
search_top_k = 5
; 搜索接口超时（秒）
search_timeout = 25

; --- RunCli 本地命令 ---
; 默认执行超时（秒），单次调用可覆盖，上限 300
cli_timeout = 60
; stdout / stderr 各自最多回传多少字符
cli_max_output = 8000

; --- loadSkill 技能加载 ---
; SKILL.md 或附件最多返回多少字符
skill_max_chars = 20000

[agent]
; 单轮提问里最多允许几轮工具调用，防止模型绕圈死循环
max_tool_rounds = 12

; --- AGENT.md 项目规则 ---
; 关闭后不再读取 AGENT.md（默认开启；没有该文件时本来也什么都不做）
rules_enabled = true
; 规则文件名，留空则依次尝试 AGENT.md / AGENTS.md 等常见命名
; 也可以写成子路径，如 docs/rules.md
rules_file = AGENT.md
; 规则最多注入多少字符，超出截断并告知模型
rules_max_chars = 8000

; --- 上下文保护 ---
; 消息总字符超过这个值就压缩早期对话（折叠成摘要）
max_context_chars = 100000
; 压缩时至少保留最近多少条消息
keep_recent_messages = 8

[mcp]
; 是否在启动时连接 MCP server
enabled = true
; 配置文件位置（相对项目根目录）。格式见 mcp.example.json
; 文件不存在时静默跳过，不影响其它功能
config = mcp.json

[trace]
; 是否记录调用追踪（.lumen/traces/*.jsonl）
; 只记长度、耗时、名字，不记对话正文与返回值
enabled = true
dir = .lumen/traces
