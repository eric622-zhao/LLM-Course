; 复制这个文件为 config.ini，然后填上你自己的信息。
; config.ini 已在 .gitignore 里，不会被提交到仓库。
;
; 使用前先执行：  copy config.example.ini config.ini

[llm]
; 接口地址。用官方 OpenAI 就保持默认；国内平台换成各自的兼容地址，例如
;   DeepSeek      https://api.deepseek.com/v1
;   Kimi/月之暗面  https://api.moonshot.cn/v1
;   通义千问       https://dashscope.aliyuncs.com/compatible-mode/v1
;   本地 Ollama    http://127.0.0.1:11434/v1
base_url = https://api.openai.com/v1

; 模型名称，必须和你使用的平台对上
model = gpt-4o-mini

; 你的 API Key，注意不要提交到 Git
api_key = sk-替换成你自己的key

; 采样温度，0 稳定、1 发散，可选
temperature = 0.7
